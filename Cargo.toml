[package]
name = "quiver"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3.32"
lapin = "4.10.0"
reqwest = { version = "0.13.4", features = ["native-tls", "json", "form"] }
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0.150"
tiny_http = "0.12.0"
tokio = { version = "1.52.3", features = ["full"]}
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
toml = "1.1.4"
url = "2.5.8"

